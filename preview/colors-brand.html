<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch {
    width: 140px; border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--bg-card);
  }
  .swatch .chip { height: 64px; }
  .swatch .meta { padding: 10px 12px; }
  .swatch .name { font: var(--fw-medium) 13px/16px var(--font-sans); color: var(--fg); }
  .swatch .hex  { font: var(--fw-regular) 11px/16px var(--font-mono); color: var(--fg-muted); margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#38BDF8"></div><div class="meta"><div class="name">Primary</div><div class="hex">#38BDF8</div></div></div>
    <div class="swatch"><div class="chip" style="background:#2DD4BF"></div><div class="meta"><div class="name">Secondary</div><div class="hex">#2DD4BF</div></div></div>
    <div class="swatch"><div class="chip" style="background:#0EA5E9"></div><div class="meta"><div class="name">Launcher</div><div class="hex">#0EA5E9</div></div></div>
    <div class="swatch"><div class="chip" style="background:#002B3D"></div><div class="meta"><div class="name">On primary</div><div class="hex">#002B3D</div></div></div>
  </div>
</body></html>
