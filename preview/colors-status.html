<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .item { display:flex; align-items:center; gap:10px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--bg-card); }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .lbl { font: var(--fw-medium) 13px/16px var(--font-sans); }
  .hex { font: 11px/16px var(--font-mono); color: var(--fg-muted); margin-left: 4px; }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="dot" style="background:#34D399"></div><div class="lbl">Success</div><div class="hex">#34D399</div></div>
    <div class="item"><div class="dot" style="background:#FBBF24"></div><div class="lbl">Warning</div><div class="hex">#FBBF24</div></div>
    <div class="item"><div class="dot" style="background:#F87171"></div><div class="lbl">Error</div><div class="hex">#F87171</div></div>
  </div>
</body></html>
