<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch { width: 130px; border-radius: var(--radius-md); overflow: hidden; background: var(--bg-card); }
  .swatch .chip { height: 56px; }
  .swatch .meta { padding: 10px 12px; }
  .swatch .name { font: var(--fw-medium) 12px/16px var(--font-sans); color: var(--fg); }
  .swatch .hex  { font: var(--fw-regular) 11px/16px var(--font-mono); color: var(--fg-muted); margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#A78BFA"></div><div class="meta"><div class="name">Plans</div><div class="hex">#A78BFA</div></div></div>
    <div class="swatch"><div class="chip" style="background:#38BDF8"></div><div class="meta"><div class="name">Workouts</div><div class="hex">#38BDF8</div></div></div>
    <div class="swatch"><div class="chip" style="background:#34D399"></div><div class="meta"><div class="name">Meals</div><div class="hex">#34D399</div></div></div>
    <div class="swatch"><div class="chip" style="background:#FBBF24"></div><div class="meta"><div class="name">Body</div><div class="hex">#FBBF24</div></div></div>
    <div class="swatch"><div class="chip" style="background:#F472B6"></div><div class="meta"><div class="name">Stats</div><div class="hex">#F472B6</div></div></div>
    <div class="swatch"><div class="chip" style="background:#94A3B8"></div><div class="meta"><div class="name">Settings</div><div class="hex">#94A3B8</div></div></div>
  </div>
</body></html>
