<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; }
  .row { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  .num { font-variant-numeric: tabular-nums; }
  .a { font: var(--fw-regular) 56px/64px var(--font-sans); }
  .b { font: var(--fw-regular) 28px/36px var(--font-sans); }
  .c { font: 14px/20px var(--font-mono); color: var(--fg-muted); }
</style></head>
<body>
  <div class="row">
    <div class="num a">82.4</div>
    <div class="num b">12,430</div>
    <div class="num b">1:24</div>
    <div class="c">tabular-nums for any updating value</div>
  </div>
</body></html>
