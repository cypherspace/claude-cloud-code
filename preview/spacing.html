<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; }
  .row { display:flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .box { background: var(--bg-card); border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; color: var(--fg-muted); font: 11px/14px var(--font-mono); }
</style></head>
<body>
  <div class="row">
    <div class="box" style="width:4px;height:48px"></div>
    <div class="box" style="width:8px;height:48px"></div>
    <div class="box" style="width:12px;height:48px"></div>
    <div class="box" style="width:16px;height:48px">16</div>
    <div class="box" style="width:24px;height:48px">24</div>
    <div class="box" style="width:32px;height:48px">32</div>
    <div class="box" style="width:48px;height:48px">48</div>
  </div>
  <div style="margin-top:14px; font: 12px/16px var(--font-mono); color: var(--fg-muted);">4dp grid · screen-pad 16 · card-pad 16 · card-gap 8–12</div>
</body></html>
