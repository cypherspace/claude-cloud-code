<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; }
  .wrap { background: var(--bg-card); border-radius: var(--radius-md); padding: 16px; max-width: 360px; }
  .top { display:flex; align-items:baseline; }
  .latest { font: var(--fw-medium) 16px/24px var(--font-sans); flex:1; letter-spacing: 0.15px; }
  .range { font: 12px/16px var(--font-sans); color: var(--fg-muted); }
  svg { display:block; margin-top: 12px; }
</style></head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="latest">Latest 82.4 kg</div>
      <div class="range">Range 81.0–83.6 kg</div>
    </div>
    <svg width="320" height="80" viewBox="0 0 320 80">
      <polyline fill="none" stroke="#0EA5E9" stroke-width="3"
        points="0,40 40,30 80,42 120,28 160,34 200,22 240,32 280,18 320,24"/>
    </svg>
  </div>
</body></html>
