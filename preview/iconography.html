<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>
<style>
  body { margin: 0; padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; max-width: 600px; }
  .ico { display:flex; flex-direction:column; align-items:center; gap: 6px; color: var(--fg); }
  .ico .m { font-family: 'Material Icons'; font-size: 26px; }
  .ico .l { font: 11px/14px var(--font-mono); color: var(--fg-muted); }
</style></head>
<body>
  <div class="row">
    <div class="ico"><span class="m">list_alt</span><span class="l">list_alt</span></div>
    <div class="ico"><span class="m">fitness_center</span><span class="l">fitness</span></div>
    <div class="ico"><span class="m">restaurant</span><span class="l">restaurant</span></div>
    <div class="ico"><span class="m">straighten</span><span class="l">straighten</span></div>
    <div class="ico"><span class="m">bar_chart</span><span class="l">bar_chart</span></div>
    <div class="ico"><span class="m">settings</span><span class="l">settings</span></div>
    <div class="ico"><span class="m">chevron_left</span><span class="l">chevron</span></div>
    <div class="ico"><span class="m">delete</span><span class="l">delete</span></div>
  </div>
</body></html>
