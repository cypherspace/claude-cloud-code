<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; }
  .stack > * + * { margin-top: 8px; }
  .meal { background: var(--bg-card); border-radius: var(--radius-md); padding: 16px; }
  .top { display:flex; align-items:center; }
  .name { font: var(--fw-medium) 16px/24px var(--font-sans); flex: 1; letter-spacing: 0.15px; }
  .type { font: var(--fw-medium) 12px/16px var(--font-sans); color: var(--fg-muted); letter-spacing: 0.5px; }
  .stats { font: 12px/16px var(--font-sans); color: var(--fg-muted); margin-top: 4px; }
  .ingredients { font: 12px/16px var(--font-sans); color: var(--fg-muted); margin-top: 4px; }
</style></head>
<body>
  <div class="stack">
    <div class="meal">
      <div class="top"><div class="name">Overnight oats</div><div class="type">Breakfast</div></div>
      <div class="stats">410 kcal · P 18g · C 62g · F 9g</div>
      <div class="ingredients">Oats (60g), milk (200g), berries (80g)</div>
    </div>
    <div class="meal">
      <div class="top"><div class="name">Chicken &amp; rice</div><div class="type">Lunch</div></div>
      <div class="stats">680 kcal · P 52g · C 78g · F 14g</div>
      <div class="ingredients">Chicken breast (180g), rice (120g)</div>
    </div>
  </div>
</body></html>
