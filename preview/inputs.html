<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; }
  .field { display:flex; flex-direction:column; gap: 4px; max-width: 320px; }
  .field + .field { margin-top: 14px; }
  .field label { font: 12px/16px var(--font-sans); color: var(--fg-muted); letter-spacing: 0.4px; padding-left: 12px; }
  .field input {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--m3-outline);
    border-radius: var(--radius-xs);
    padding: 12px 16px;
    font: 16px/24px var(--font-sans);
  }
  .field input:focus { outline: none; border-color: var(--m3-primary); border-width: 2px; padding: 11px 15px; }
</style></head>
<body>
  <div class="field"><label>Your name</label><input value="Alex"/></div>
  <div class="field"><label>Reps</label><input value="12"/></div>
  <div class="field"><label>Weight (kg)</label><input placeholder="e.g. 22.5"/></div>
</body></html>
